name: CI - ML Service

on:
  push:
    branches: [main]
    paths:
      - 'apps/ml-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ml-service/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ml-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 app/ --max-line-length=120 --extend-ignore=E203 || true

      - name: Run tests
        run: |
          pip install pytest
          pytest || echo "No tests found yet"
